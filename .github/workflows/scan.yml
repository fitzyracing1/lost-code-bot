name: daily-scan
on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      top:
        description: "How many top-starred code repos to scan"
        default: "50"
permissions:
  contents: write   # only to commit findings/ back to this repo
concurrency:
  group: daily-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GITHUB_TOKEN only; 1000 req/h budget
        run: |
          set +e
          lostcode scan --top "${{ inputs.top || '50' }}" --lookups 15 --min-remaining 100 \
            --out findings/runs/latest.json --summary "$GITHUB_STEP_SUMMARY"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Commit queue diff
        run: |
          git config user.name "lost-code-bot"
          git config user.email "lost-code-bot@users.noreply.github.com"
          git add findings/queue.json findings/runs/latest.json
          if git diff --cached --quiet; then echo "No queue changes."; exit 0; fi
          git diff --cached --stat
          git commit -m "scan: queue update $(date -u +%F)"
          git pull --rebase --quiet && git push
      - name: Light
        run: |
          if [ "${{ steps.scan.outputs.rc }}" = "0" ]; then echo "Light: LIT (scan ran cleanly)"; else echo "Light: DARK (scan did not run cleanly)"; exit 1; fi
