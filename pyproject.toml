[project]
name = "lostcode"
version = "0.1.0"
description = "Find lost code (references to files that no longer exist) in public GitHub repos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lostcode = "lostcode.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lostcode"]
